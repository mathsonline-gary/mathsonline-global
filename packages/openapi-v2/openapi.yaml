openapi: 3.1.0

info:
  title: Membership API
  version: "2.0.0"
  description: |
    HTTP API for the membership application, version 2.

servers:
  - url: https://{host}/api/v2
    description: Application host
    variables:
      host:
        default: www.mathsonline.co
        description: Any domain served by this application.
  - url: http://localhost:{port}/api/v2
    description: Local development
    variables:
      port:
        default: "8080"
        description: Port the local back end is served on.

tags:
  - name: Brands
    description: Storefront configuration per brand, addressed by brand code.
  - name: Pricing
    description: What a brand's memberships cost, grouped as the customer is offered them.

# One file per resource; the pointer after `#` is the path string with `/` escaped as `~1`, so the
# key above each `$ref` and the pointer inside it spell the same URL.
paths:
  /brands/{brandCode}:
    $ref: "./paths/brands.yaml#/~1brands~1{brandCode}"
  /brands/{brandCode}/pricing:
    $ref: "./paths/pricing.yaml#/~1brands~1{brandCode}~1pricing"

components:
  responses:
    Unauthenticated:
      $ref: "./responses/errors.yaml#/Unauthenticated"
    Forbidden:
      $ref: "./responses/errors.yaml#/Forbidden"
    NotFound:
      $ref: "./responses/errors.yaml#/NotFound"
    MethodNotAllowed:
      $ref: "./responses/errors.yaml#/MethodNotAllowed"
    ValidationError:
      $ref: "./responses/errors.yaml#/ValidationError"
    TooManyRequests:
      $ref: "./responses/errors.yaml#/TooManyRequests"
    ServerError:
      $ref: "./responses/errors.yaml#/ServerError"

  schemas:
    Error:
      $ref: "./schemas/error.yaml#/Error"
    ValidationError:
      $ref: "./schemas/error.yaml#/ValidationError"
    PaginationLinks:
      $ref: "./schemas/pagination.yaml#/PaginationLinks"
    PaginationMeta:
      $ref: "./schemas/pagination.yaml#/PaginationMeta"
    PaginationLink:
      $ref: "./schemas/pagination.yaml#/PaginationLink"
    Brand:
      $ref: "./schemas/brand.yaml#/Brand"
    BrandCode:
      $ref: "./schemas/brand.yaml#/BrandCode"
    Pricing:
      $ref: "./schemas/pricing.yaml#/Pricing"
    PricingTable:
      $ref: "./schemas/pricing.yaml#/PricingTable"
