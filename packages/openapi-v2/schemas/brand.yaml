Brand:
  type: object
  description: |
    Storefront configuration for one brand: display copy, currency, contact points, and the
    publishable third-party keys a client initialises with.
  required:
    [
      code,
      name,
      market,
      currency,
      marketing_website,
      info_email,
      feedback_email,
    ]
  properties:
    code:
      $ref: "./brand.yaml#/BrandCode"
    name:
      type: string
      description: |
        The product name the customer sees this brand under. Varies between brands, so copy
        interpolates it rather than spelling it out.
      examples: ["MathsOnline"]
    market:
      type: string
      description: |
        The country this brand sells into, as display text. Display only — branch on `code`, never
        on this.
      examples: ["Australia"]
    currency:
      type: string
      minLength: 3
      maxLength: 3
      description: The brand's default currency, ISO 4217 alpha-3, upper-case.
      examples: ["AUD"]
    marketing_website:
      type: string
      format: uri
      examples: ["https://www.mathsonline.co/au"]
    info_email:
      type: string
      format: email
      examples: ["info@mathsonline.com.au"]
    feedback_email:
      type: string
      format: email
      examples: ["feedback@mathsonline.com.au"]
    support_phone:
      type: [string, "null"]
      examples: ["123-456-7890"]
    social_facebook:
      type: [string, "null"]
      format: uri
      examples: ["https://www.facebook.com/mathsonline"]
    social_instagram:
      type: [string, "null"]
      format: uri
      examples: ["https://www.instagram.com/mathsonline"]
    stripe:
      type: object
      description: |
        Publishable Stripe configuration. Absent when the brand has no Stripe account configured.
      properties:
        publishable_key:
          type: string
          examples: ["pk_live_51H0000000000000000000000"]
    google:
      type: object
      description: |
        Publishable Google keys. Absent when none are configured; an individual key is absent when
        that integration is not set up for the brand.
      properties:
        recaptcha_site_key:
          type: string
          description: reCAPTCHA site key, required to submit protected forms.
          examples: ["6LcEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEXX"]
        maps_api_key:
          type: string
          description: Maps JavaScript API key, used for address autocompletion.
          examples: ["AIzaSyEXAMPLE-EXAMPLE-EXAMPLE-EXAMPLE1234"]
        tag_manager_container_id:
          type: string
          examples: ["GTM-XXXXXXX"]

BrandCode:
  type: string
  description: |
    Identifies a brand. Membership's own `brands.code`, upper-case and taken verbatim. Not a country
    code and not a URL segment — a purchase URL's `au` is a market slug that a consumer maps onto
    `MOL_AU`. Validate against this enum, never against an ISO country list.
  enum: [MOL_AU, MOL_UK, MOL_US]
  examples: ["MOL_AU"]
