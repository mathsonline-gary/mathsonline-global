type: object
description: |
  The `meta` object of a paginated resource collection, as produced by a `LengthAwarePaginator`.
  `from` and `to` are null when the page is empty.

  A simple paginator omits `last_page`, `links` and `total`; a cursor paginator replaces this
  object entirely with `next_cursor`/`prev_cursor`. Describe those shapes on the operations that
  use them rather than widening this schema.
required: [current_page, path, per_page]
properties:
  current_page:
    type: integer
  from:
    type: [integer, 'null']
  last_page:
    type: integer
  links:
    type: array
    items:
      $ref: './PaginationLink.yaml'
  path:
    type: string
    format: uri
    description: Base URL for pagination links.
  per_page:
    type: integer
  to:
    type: [integer, 'null']
  total:
    type: integer
