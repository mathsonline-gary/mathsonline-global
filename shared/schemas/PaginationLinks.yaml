type: object
description: |
  The `links` object of a paginated resource collection. `prev` and `next` are null at the ends of
  the range.
required: [first, last, prev, next]
properties:
  first:
    type: [string, 'null']
    format: uri
  last:
    type: [string, 'null']
    format: uri
  prev:
    type: [string, 'null']
    format: uri
  next:
    type: [string, 'null']
    format: uri
